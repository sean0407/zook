name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        env:
          ZOOK_SKIP_UPDATE_CHECK: '1'
          ZOOK_SHELL_ENV: '0'
        run: /usr/bin/python3 -m unittest discover -s tests -p '*test.py' -v
      - name: Build the app
        run: bash scripts/build.sh
      - name: Check the built app
        run: /usr/bin/python3 scripts/check_app.py build/Zook.app
